# Development only (pnpm infra:up): postgres and valkey on localhost, for the server running
# on the host. Installs don't use this file, so their database and Valkey stay inside Docker.
services:
  valkey:
    ports:
      - "127.0.0.1:6379:6379"
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
