<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ColTex</title>
    <script>
      // Apply the saved theme before the first paint (see src/lib/theme.ts).
      try {
        var c = localStorage.getItem('coltex:theme')
        if (c === 'dark' || c === 'moss' || c === 'espresso') document.documentElement.classList.add('dark')
        if (c === 'forest' || c === 'moss' || c === 'sepia' || c === 'espresso') document.documentElement.dataset.theme = c
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
