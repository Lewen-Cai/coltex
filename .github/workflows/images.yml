name: Images
# Runs are named by what they publish ("Images v0.0.3", "Images main").
run-name: Images ${{ github.ref_name }}

# Prebuilt images on ghcr.io, which install.sh and `coltex update` pull:
#   ghcr.io/<owner>/coltex-server:<ref>
#   ghcr.io/<owner>/coltex-compiler:<ref>-standard | <ref>-full
# <ref> is the release tag (v0.0.2, plus "latest"; a pre-release only its own tag)
# or "main". Each architecture
# is built on its own native runner and pushed by digest; the merge job then
# puts them together under the tags.
#
# The mirror job then copies them to Alibaba Cloud Container Registry, for
# installs in mainland China (mirror.yml, which also runs by hand).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [server, compiler-standard, compiler-full]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: server
            name: coltex-server
            dockerfile: apps/server/Dockerfile
          - image: compiler-standard
            name: coltex-compiler
            dockerfile: services/compiler/Dockerfile
            edition: standard
          - image: compiler-full
            name: coltex-compiler
            dockerfile: services/compiler/Dockerfile
            edition: full
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Image name
        # Registry paths must be lower case; the owner's name may not be.
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PAIR=${{ matrix.image }}-${platform//\//-}" >> "$GITHUB_ENV"

      - name: Free disk space
        # TeX Live is 9 GB (standard) to 20 GB (full) unpacked; the runner's
        # preinstalled toolchains are not needed here.
        if: matrix.image != 'server'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost /usr/local/julia* || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v7

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.edition && format('EDITION={0}', matrix.edition) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The server's layers are small enough for the Actions cache; TeX Live's are not.
          cache-from: ${{ matrix.image == 'server' && format('type=gha,scope={0}', env.PAIR) || '' }}
          cache-to: ${{ matrix.image == 'server' && format('type=gha,scope={0},mode=max', env.PAIR) || '' }}

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            name: coltex-server
            suffix: ""
          - image: compiler-standard
            name: coltex-compiler
            suffix: -standard
          - image: compiler-full
            name: coltex-compiler
            suffix: -full
    steps:
      - name: Image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # v0.0.2 and latest for a release, main for the branch: the names
          # install.sh writes to COLTEX_IMAGE_TAG. Pre-releases (tags with a
          # "-") never become latest.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=branch

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  mirror:
    # The same images on Alibaba Cloud (mirror.yml), once they are on ghcr.io.
    needs: merge
    if: vars.ALIYUN_IMAGES != ''
    uses: ./.github/workflows/mirror.yml
    with:
      ref: ${{ github.ref_name }}
      latest: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    secrets: inherit

  scan:
    # Known vulnerabilities in what was just published (scan.yml; report only).
    needs: merge
    uses: ./.github/workflows/scan.yml
    with:
      ref: ${{ github.ref_name }}
